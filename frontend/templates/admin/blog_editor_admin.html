<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if post_id %}Edit Post{% else %}Create New Post{% endif %} | Admin</title>
    
    <!-- Base CSS Files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/components.css') }}">
    
    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/blog_admin.css') }}">
    
    <style>
        /* Blog Editor specific styles - FIXED ALIGNMENT */
        .blog-editor-container {
            margin-left: var(--sidebar-width);
            padding: var(--spacing-xl) var(--spacing-2xl);
            max-width: calc(100% - var(--sidebar-width));
            box-sizing: border-box;
            overflow-x: hidden;
        }
        
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-lg);
            border-bottom: 2px solid var(--border-secondary);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }
        
        .editor-header h2 {
            color: var(--text-primary);
            font-size: 2.5rem;
            font-weight: var(--font-weight-bold);
            background: linear-gradient(45deg, var(--accent-primary), #0066cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        
        .editor-form {
            background: var(--gradient-card);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-lg);
            border: 2px solid var(--border-primary);
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .form-section {
            margin-bottom: var(--spacing-xl);
        }
        
        .form-section h3 {
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-xl);
        }
        
        .content-editor {
            min-height: 400px;
            border: 2px solid var(--border-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: var(--font-size-md);
            line-height: 1.6;
            outline: none;
            overflow-y: auto;
        }
        
        .content-editor:focus {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-focus);
        }
        
        .content-editor[contenteditable]:empty::before {
            content: attr(placeholder);
            color: var(--text-muted);
            font-style: italic;
        }
        
        .editor-toolbar {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            flex-wrap: wrap;
        }
        
        .toolbar-btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border-primary);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-normal);
            font-size: var(--font-size-sm);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        
        .toolbar-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--brand-accent);
        }
        
        .form-actions {
            display: flex;
            gap: var(--spacing-md);
            justify-content: flex-end;
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--border-secondary);
            flex-wrap: wrap;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            color: var(--text-primary);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--spacing-sm);
            font-size: var(--font-size-md);
        }
        
        .form-control {
            background-color: var(--bg-tertiary);
            border: 2px solid var(--border-primary);
            color: var(--text-primary);
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: var(--font-size-md);
            transition: all var(--transition-normal);
            width: 100%;
            box-sizing: border-box;
        }
        
        .form-control:focus {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-focus);
            outline: none;
        }
        
        .checkbox-group {
            display: flex;
            gap: var(--spacing-lg);
            align-items: center;
        }
        
        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: var(--font-size-base);
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: var(--spacing-sm);
            transform: scale(1.2);
        }
        
        @media (max-width: 768px) {
            .blog-editor-container {
                margin-left: 0;
                padding: var(--spacing-lg);
                max-width: 100%;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .editor-header {
                flex-direction: column;
                gap: var(--spacing-md);
                text-align: center;
            }
            
            .editor-toolbar {
                justify-content: center;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .checkbox-group {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--spacing-md);
            }
        }
    </style>
</head>

    <!-- Blog Editor JavaScript -->
    <script>
        // Global variables - FIXED FLASK TEMPLATE SYNTAX
        let isEditing = {% if post_id %}true{% else %}false{% endif %};
        let editingPostId = {% if post_id %}'{{ post_id }}'{% else %}null{% endif %};

        document.addEventListener('DOMContentLoaded', function() {
            setupEditor();
            if (isEditing && editingPostId) {
                loadPostForEditing();
            }
        });

        function setupEditor() {
            const contentEditor = document.getElementById('contentEditor');
            const postContent = document.getElementById('postContent');
            
            // Sync content editor with hidden textarea
            if (contentEditor && postContent) {
                contentEditor.addEventListener('input', function() {
                    postContent.value = this.innerHTML;
                    updateReadTime();
                });

                // Handle paste events to clean up formatting
                contentEditor.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                    document.execCommand('insertText', false, text);
                });
            }

            // Form submission
            const form = document.getElementById('blogPostForm');
            if (form) {
                form.addEventListener('submit', handleFormSubmit);
            }
        }

        async function loadPostForEditing() {
            try {
                const post = await Api.admin.getBlogPost(editingPostId);
                populateForm(post);
            } catch (error) {
                console.error('Error loading post:', error);
                Utils.showNotification('Failed to load post for editing.', 'error');
            }
        }

        function populateForm(post) {
            // Populate basic fields
            document.getElementById('postTitle').value = post.title || '';
            document.getElementById('postExcerpt').value = post.excerpt || '';
            document.getElementById('postCategory').value = post.category || '';
            document.getElementById('readTime').value = post.readTime || '';
            document.getElementById('postImage').value = post.image || '';

            // Populate content
            const contentEditor = document.getElementById('contentEditor');
            const postContent = document.getElementById('postContent');
            if (contentEditor && postContent) {
                contentEditor.innerHTML = post.content || '';
                postContent.value = post.content || '';
            }

            // Populate checkboxes
            document.getElementById('isFeatured').checked = post.featured || false;
            document.getElementById('isPublished').checked = post.published !== false;
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            if (!validateForm()) return;

            const formData = getFormData();
            
            try {
                showSaving();
                
                let result;
                if (isEditing && editingPostId) {
                    result = await Api.admin.updateBlogPost(editingPostId, formData);
                } else {
                    result = await Api.admin.createBlogPost(formData);
                }
                
                Utils.showNotification(
                    isEditing ? 'Post updated successfully!' : 'Post created successfully!', 
                    'success'
                );
                
                setTimeout(() => {
                    window.location.href = '/admin/blog';
                }, 1500);
                
            } catch (error) {
                console.error('Error saving post:', error);
                Utils.showNotification('Failed to save post. Please try again.', 'error');
            } finally {
                hideSaving();
            }
        }

        function getFormData() {
            return {
                title: document.getElementById('postTitle').value.trim(),
                excerpt: document.getElementById('postExcerpt').value.trim(),
                content: document.getElementById('postContent').value.trim(),
                category: document.getElementById('postCategory').value,
                readTime: parseInt(document.getElementById('readTime').value) || calculateReadTime(),
                image: document.getElementById('postImage').value.trim() || null,
                featured: document.getElementById('isFeatured').checked,
                published: document.getElementById('isPublished').checked
            };
        }

        function validateForm() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const category = document.getElementById('postCategory').value;

            if (!title) {
                Utils.showNotification('Please enter a post title.', 'error');
                document.getElementById('postTitle').focus();
                return false;
            }

            if (!content) {
                Utils.showNotification('Please enter post content.', 'error');
                document.getElementById('contentEditor').focus();
                return false;
            }

            if (!category) {
                Utils.showNotification('Please select a category.', 'error');
                document.getElementById('postCategory').focus();
                return false;
            }

            return true;
        }

        function formatText(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('contentEditor').focus();
            document.getElementById('postContent').value = document.getElementById('contentEditor').innerHTML;
        }

        function insertLink() {
            const url = prompt('Enter the URL:');
            if (url) {
                formatText('createLink', url);
            }
        }

        function calculateReadTime() {
            const content = document.getElementById('contentEditor').textContent;
            const wordCount = content.trim().split(/\s+/).length;
            return Math.max(1, Math.round(wordCount / 225));
        }

        function updateReadTime() {
            const readTimeField = document.getElementById('readTime');
            if (readTimeField && !readTimeField.value) {
                readTimeField.value = calculateReadTime();
            }
        }

        async function saveDraft() {
            if (!validateForm()) return;

            const formData = getFormData();
            formData.published = false;

            try {
                showSaving();
                
                if (isEditing && editingPostId) {
                    await Api.admin.updateBlogPost(editingPostId, formData);
                } else {
                    const result = await Api.admin.createBlogPost(formData);
                    if (result && result.post && result.post.id) {
                        editingPostId = result.post.id;
                        isEditing = true;
                    }
                }
                
                Utils.showNotification('Draft saved successfully!', 'success');
            } catch (error) {
                console.error('Error saving draft:', error);
                Utils.showNotification('Failed to save draft. Please try again.', 'error');
            } finally {
                hideSaving();
            }
        }

        function showSaving() {
            const saveBtn = document.getElementById('saveBtn');
            if (saveBtn) {
                saveBtn.textContent = 'Saving...';
                saveBtn.disabled = true;
            }
        }

        function hideSaving() {
            const saveBtn = document.getElementById('saveBtn');
            if (saveBtn) {
                saveBtn.innerHTML = isEditing ? 
                    `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Update Post` : 
                    `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Save Post`;
                saveBtn.disabled = false;
            }
        }

        // Navigation functions
        function navigateToDashboard() { window.location.href = '/admin'; }
        function navigateToBlog() { window.location.href = '/admin/blog'; }
        function navigateToNewPost() { window.location.href = '/admin/blog/new'; }
        function navigateToUpload() { window.location.href = '/admin/upload'; }
        
        function toggleMobileSidebar() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) sidebar.classList.toggle('mobile-open');
        }

        // Mobile menu functionality
        function checkScreenSize() {
            const mobileBtn = document.querySelector('.mobile-menu-btn');
            if (window.innerWidth <= 768) {
                mobileBtn.style.display = 'block';
            } else {
                mobileBtn.style.display = 'none';
                const sidebar = document.querySelector('.sidebar');
                if (sidebar) sidebar.classList.remove('mobile-open');
            }
        }

        window.addEventListener('resize', checkScreenSize);
        checkScreenSize();

        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            if ((event.ctrlKey || event.metaKey) && event.key === 's') {
                event.preventDefault();
                document.getElementById('blogPostForm').dispatchEvent(new Event('submit'));
            }

            if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key === 'S') {
                event.preventDefault();
                saveDraft();
            }
        });
    </script>
</body>
</html>
