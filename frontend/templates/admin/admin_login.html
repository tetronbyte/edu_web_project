<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V65PG4DBXS"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V65PG4DBXS');
    </script>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    
    <!-- CSS links -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/admin.css') }}">
</head>
<body>
    <div class="login-container">
        <h2>Admin Login</h2>
        <form method="POST" id="loginForm">
            <input type="text" name="username" placeholder="Username" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Log In</button>
        </form>
        <div class="flash">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
    </div>

    <!-- Updated JavaScript links - Core files first, then page-specific -->
    <script src="{{ url_for('static', filename='javascript/core/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='javascript/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='javascript/pages/admin.js') }}"></script>
</body>
</html>
