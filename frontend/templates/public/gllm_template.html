<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V65PG4DBXS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-V65PG4DBXS');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLLM - Graphing Calculator | Dectinity</title>
    
    <!-- CSS files in correct order -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/components.css') }}">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/gllm.css') }}"> -->
    
    <!-- Desmos Calculator API - Updated to v1.11 -->
    <script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
</head>
<body class="with-topbar">
    <!-- Topbar -->
    <header class="topbar">
        <div class="logo">
            <a href="/">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo">
            </a>
            <span class="logo-text" style="font-weight: normal;">Dectinity</span>
        </div>
        <div class="button-group">
            <a href="/" class="button">Home</a>
            <a href="/notes" class="button">Notes</a>
            <a href="/blog" class="button">Blog</a>

            <!-- Clubs Dropdown -->
            <div class="nav-dropdown">
                <button class="dropdown-toggle">Clubs</button>
                <div class="dropdown-menu">
                    <a href="/clubs" class="dropdown-item">Clubs Home</a>
                    <a href="/clubs/sports" class="dropdown-item">Sports Club</a>
                    <a href="/clubs/photography" class="dropdown-item">Photography Club</a>
                    <a href="/clubs/drama" class="dropdown-item">Drama Club</a>
                    <a href="/clubs/dance" class="dropdown-item">Dance Club</a>
                    <a href="/clubs/chess" class="dropdown-item">Chess Club</a>
                </div>
            </div>

            <!-- Miscellaneous Dropdown -->
            <div class="nav-dropdown">
                <button class="dropdown-toggle">Miscellaneous</button>
                <div class="dropdown-menu">
                    <a href="/creative_arena" class="dropdown-item">Creative Arena</a>
                    <a href="/gllm" class="dropdown-item">GLLM</a>
                    <a href="/gpa_calculator" class="dropdown-item">GPA Calc</a>
                    <a href="/gpa_predictor" class="dropdown-item">GPA Predict</a>
                </div>
            </div>


        <button class="mobile-topbar-menu" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="mobile-nav-dropdown">
            <button class="nav-btn" onclick="window.location.href='/'">Home</button>
            <button class="nav-btn" onclick="window.location.href='/notes'">Notes</button>
            <button class="nav-btn active" onclick="window.location.href='/clubs'">Clubs</button>
            <button class="nav-btn" onclick="window.location.href='/blog'">Blog</button>
            <button class="nav-btn" onclick="window.location.href='/gllm'">GLLM</button>
            <button class="nav-btn" onclick="window.location.href='/gpa_calculator'">GPA Calculator</button>
            <button class="nav-btn" onclick="window.location.href='/gpa_predictor'">GPA Predictor</button>
            <button class="nav-btn" onclick="window.location.href='/creative-arena'">Creative Arena</button>
        </div>

    </header>

    <!-- Main Content -->
    <div class="gllm-container container-fluid">
        <!-- Header -->
        <div class="gllm-header">
            <h1 class="text-gradient">GLLM Graphing Calculator</h1>
            <p class="text-secondary">Enter a math problem to generate equations and see interactive graphs.</p>
        </div>
        
        <!-- Split Layout: Graph + Chat -->
        <div class="gllm-split-layout">
            <!-- Left Side: Calculator -->
            <div class="gllm-graph-panel">
                <div class="panel-header">
                    <h3>Interactive Graph</h3>
                    <div class="graph-controls">
                        <button id="resetGraph" class="btn btn-sm btn-secondary">Reset</button>
                        <button id="screenshotGraph" class="btn btn-sm btn-secondary">Screenshot</button>
                    </div>
                </div>
                <div id="calculator" class="calculator-container"></div>
                
                <!-- Equations List -->
                <div class="equations-section">
                    <h4>Current Equations</h4>
                    <div id="equationsList" class="equations-list"></div>
                </div>
            </div>
            
            <!-- Right Side: Chat -->
            <div class="gllm-chat-panel">
                <div class="panel-header">
                    <h3>Math Assistant</h3>
                    <span id="chatStatus" class="status-indicator">Ready</span>
                </div>
                
                <!-- Chat Messages -->
                <div id="chatMessages" class="chat-messages"></div>
                
                <!-- Input Form -->
                <form id="gllmForm" class="chat-input-form">
                    <div class="input-group">
                        <textarea 
                            id="chatInput" 
                            class="form-control" 
                            rows="2" 
                            placeholder="Ask me to graph equations, solve problems, or explain concepts..."></textarea>
                        <button id="sendMessage" type="submit" class="btn btn-primary send-btn">
                            <span id="sendText">Send</span>
                            <span id="sendSpinner" class="hidden">⏳</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript files -->
    <!-- <script src="{{ url_for('static', filename='javascript/core/utils.js') }}"></script> -->
    <!--<script src="{{ url_for('static', filename='javascript/core/api.js') }}"></script> -->
    <!--<script src="{{ url_for('static', filename='javascript/pages/gllm.js') }}"></script> -->
</body>
</html>
