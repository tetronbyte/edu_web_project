<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Materials - Home</title>
    
    <!-- Base CSS Files -->
    <link rel="stylesheet" href="../../static/css/base/reset.css">
    <link rel="stylesheet" href="../../static/css/base/themes.css">
    <link rel="stylesheet" href="../../static/css/base/layout.css">
    <link rel="stylesheet" href="../../static/css/base/components.css">
</head>
<body class="layout-public">
    <!-- Enhanced Topbar -->
    <div class="topbar">
        <!-- Logo on the left -->
        <div class="logo">
            <img src="../../static/images/logo.jpg" alt="Study Hub Logo">
            <span class="logo-text">Study Hub</span>
        </div>
        
        <!-- Navigation buttons on the right -->
        <div class="nav-group">
            <button onclick="window.location.href='/'" class="active-nav">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 12L5 10L12 17L22 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 12V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Home
            </button>
            
            <button onclick="window.location.href='/blog'">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14.828 14.828C15.5 14.156 16 13.204 16 12.172C16 10.109 14.364 8.47297 12.301 8.47297C11.269 8.47297 10.317 8.97297 9.645 9.64497" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Blog
            </button>
            
            <button onclick="window.location.href='/gllm'">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                    <path d="M2 12H22" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 2C14.5013 4.73835 15.9228 8.29203 16 12C15.9228 15.708 14.5013 19.2616 12 22" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 2C9.49872 4.73835 8.07725 8.29203 8 12C8.07725 15.708 9.49872 19.2616 12 22" stroke="currentColor" stroke-width="2"/>
                </svg>
                GLLM
            </button>
            
            <button onclick="window.location.href='/gpa-calculator'">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M9 9L15 15" stroke="currentColor" stroke-width="2"/>
                    <path d="M15 9L9 15" stroke="currentColor" stroke-width="2"/>
                </svg>
                GPA Calc
            </button>
            
            <button onclick="window.location.href='/gpa-predictor'">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 12H18L15 21L9 3L6 12H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                GPA Predict
            </button>
        </div>
        
        <!-- Mobile menu button -->
        <button class="mobile-topbar-menu" onclick="toggleMobileNav()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        
        <!-- Mobile dropdown menu -->
        <div class="mobile-nav-dropdown" id="mobileNavDropdown">
            <button onclick="window.location.href='/'; closeMobileNav();" class="active-nav">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 12L5 10L12 17L22 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Home
            </button>
            <button onclick="window.location.href='/blog'; closeMobileNav();">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14.828 14.828C15.5 14.156 16 13.204 16 12.172C16 10.109 14.364 8.47297 12.301 8.47297" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Blog
            </button>
            <button onclick="window.location.href='/gllm'; closeMobileNav();">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                </svg>
                GLLM
            </button>
            <button onclick="window.location.href='/gpa-calculator'; closeMobileNav();">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
                </svg>
                GPA Calc
            </button>
            <button onclick="window.location.href='/gpa-predictor'; closeMobileNav();">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 12H18L15 21L9 3L6 12H2" stroke="currentColor" stroke-width="2"/>
                </svg>
                GPA Predict
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content-public">
        <!-- Your existing content here -->
    </div>

    <!-- Core JavaScript -->
    <script src="../../static/javascript/core/utils.js"></script>
    <script src="../../static/javascript/core/api.js"></script>
    
    <script>
        function toggleMobileNav() {
            const dropdown = document.getElementById('mobileNavDropdown');
            dropdown.classList.toggle('active');
        }
        
        function closeMobileNav() {
            const dropdown = document.getElementById('mobileNavDropdown');
            dropdown.classList.remove('active');
        }
        
        // Close mobile nav when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('mobileNavDropdown');
            const menuBtn = document.querySelector('.mobile-topbar-menu');
            
            if (!dropdown.contains(event.target) && !menuBtn.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });
    </script>
</body>
</html>
