<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V65PG4DBXS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-V65PG4DBXS');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dectinity | Notes</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/components.css') }}">
</head>
<body class="with-topbar">

    <!-- ✅ Topbar -->
    <div class="topbar">
        <!-- Left: Logo + Site Name -->
        <div class="logo">
            <a href="/">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo">
            </a>
            <span class="logo-text" style="font-weight: normal;">Dectinity</span>
        </div>

        <!-- Right: Navigation Buttons -->
        <div class="button-group">
            <a href="/" class="button">Home</a>
            <a href="/notes" class="button">Notes</a>
            <a href="/gllm" class="button">GLLM</a>
            <a href="/gpa_calculator" class="button">GPA Calc</a>
            <a href="/gpa_predictor" class="button">GPA Predict</a>
        </div>
    </div>

    <!-- ✅ Notes Page Content -->
    <main style="margin-top: var(--topbar-height); padding: var(--spacing-xl);">
        <!-- Course Buttons -->
        <div class="course-container" id="courseButtons">
            <!-- Populated by JS -->
        </div>

        <!-- Semester Buttons -->
        <div class="semester-container" id="semesterButtons">
            <!-- Populated by JS -->
        </div>

        <!-- Subject Buttons -->
        <div class="subject-container" id="subjectButtons">
            <!-- Populated by JS -->
        </div>

        <!-- Notes List -->
        <div class="notes-container" id="notesContainer">
            <!-- Populated by JS -->
        </div>

        <!-- Back Button -->
        <button class="backButton" id="backButton" onclick="goBack()">← Back</button>
    </main>

    <!-- ✅ Scripts -->
    <script src="{{ url_for('static', filename='javascript/core/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='javascript/core/api.js') }}"></script>
    <script src="{{ url_for('static', filename='javascript/pages/notes.js') }}"></script>
</body>
</html>
