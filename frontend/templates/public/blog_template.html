<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V65PG4DBXS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-V65PG4DBXS');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dectinity | Blog</title>
    
    <!-- Base CSS Files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/components.css') }}">
    
    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/blog_public.css') }}">

    <!-- Custom Inline Styling for Search Button -->
    <style>
        .search-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }

        .search-input {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            flex: 1;
        }

        .search-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .search-btn:hover {
            background-color: #f0f0f0;
        }

        .search-icon {
            width: 20px;
            height: 20px;
            stroke: #333;
        }
    </style>
</head>
<body class="with-topbar">
    <!-- ✅ Topbar -->
    <!-- Topbar -->
    <header class="topbar">
        <div class="logo">
            <a href="/">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo">
            </a>
            <span class="logo-text" style="font-weight: normal;">Dectinity</span>
        </div>
        <div class="button-group">
            <a href="/" class="button">Home</a>
            <a href="/notes" class="button">Notes</a>
            <a href="/blog" class="button">Blog</a>

            <!-- Clubs Dropdown -->
            <div class="nav-dropdown">
                <button class="dropdown-toggle">Clubs</button>
                <div class="dropdown-menu">
                    <a href="/clubs" class="dropdown-item">Clubs Home</a>
                    <a href="/clubs/sports" class="dropdown-item">Sports Club</a>
                    <a href="/clubs/photography" class="dropdown-item">Photography Club</a>
                    <a href="/clubs/drama" class="dropdown-item">Drama Club</a>
                    <a href="/clubs/dance" class="dropdown-item">Dance Club</a>
                    <a href="/clubs/chess" class="dropdown-item">Chess Club</a>
                </div>
            </div>

            <!-- Miscellaneous Dropdown -->
            <div class="nav-dropdown">
                <button class="dropdown-toggle">Miscellaneous</button>
                <div class="dropdown-menu">
                    <a href="/creative_arena" class="dropdown-item">Creative Arena</a>
                    <a href="/gllm" class="dropdown-item">GLLM</a>
                    <a href="/gpa_calculator" class="dropdown-item">GPA Calc</a>
                    <a href="/gpa_predictor" class="dropdown-item">GPA Predict</a>
                </div>
            </div>


        <button class="mobile-topbar-menu" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="mobile-nav-dropdown">
            <button class="nav-btn" onclick="window.location.href='/'">Home</button>
            <button class="nav-btn" onclick="window.location.href='/notes'">Notes</button>
            <button class="nav-btn active" onclick="window.location.href='/clubs'">Clubs</button>
            <button class="nav-btn" onclick="window.location.href='/blog'">Blog</button>
            <button class="nav-btn" onclick="window.location.href='/gllm'">GLLM</button>
            <button class="nav-btn" onclick="window.location.href='/gpa_calculator'">GPA Calculator</button>
            <button class="nav-btn" onclick="window.location.href='/gpa_predictor'">GPA Predictor</button>
            <button class="nav-btn" onclick="window.location.href='/creative-arena'">Creative Arena</button>
        </div>

    </header>

    <!-- Main Content -->
    <div class="main-content-public">
        <!-- Blog Header -->
        <div class="blog-header">
            <h2>Dectinity Blog</h2>
            <p>Latest updates, tutorials, and study tips</p>
        </div>

        <!-- Search and Filter Controls -->
        <div class="blog-controls">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search posts...">
                <button class="search-btn" aria-label="Search">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="16.5" y1="16.5" x2="21" y2="21" />
                    </svg>
                </button>
            </div>

            <select id="categoryFilter" class="filter-select">
                <option value="">All Categories</option>
                <option value="announcements">Announcements</option>
                <option value="tutorials">Tutorials</option>
                <option value="study-tips">Study Tips</option>
                <option value="resources">Resources</option>
            </select>
        </div>

        <!-- Featured Post Section -->
        <div id="featuredPost" class="featured-section">
            <!-- Featured post will be loaded dynamically -->
        </div>

        <!-- Blog Posts Grid -->
        <div id="blogContainer" class="blog-container">
            <!-- Blog posts will be loaded dynamically -->
        </div>

        <!-- Load More Button -->
        <div class="load-more-container">
            <button id="loadMoreBtn" class="load-more-btn">Load More Posts</button>
        </div>
    </div>

    <!-- Core JavaScript -->
    <script src="{{ url_for('static', filename='javascript/core/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='javascript/core/api.js') }}"></script>

    <!-- Page-specific JavaScript -->
    <script src="{{ url_for('static', filename='javascript/pages/blog_public.js') }}"></script>
</body>
</html>
