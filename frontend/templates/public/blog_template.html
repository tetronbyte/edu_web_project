<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V65PG4DBXS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-V65PG4DBXS');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dectinity | Blog</title>
    
    <!-- Base CSS Files -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/components.css') }}">
    
    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/blog_public.css') }}">
</head>
<body class="with-topbar">
    <!-- ✅ Topbar -->
    <div class="topbar">
        <!-- Left: Logo + Site Name -->
        <div class="logo">
            <a href="/">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo">
            </a>
            <span class="logo-text" style="font-weight: normal;">Dectinity</span>
        </div>

        <!-- Right: Navigation Buttons -->
        <div class="button-group">
            <a href="/" class="button">Home</a>
            <a href="/notes" class="button">Notes</a>
            <a href="/gllm" class="button">GLLM</a>
            <a href="/gpa_calculator" class="button">GPA Calc</a>
            <a href="/gpa_predictor" class="button">GPA Predict</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content-public">
        <!-- Blog Header -->
        <div class="blog-header">
            <h1>Dectinity Blog</h1>
            <p>Latest updates, tutorials, and study tips</p>
        </div>

        <!-- Search and Filter Controls -->
        <div class="blog-controls">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search posts...">
                <button class="search-btn">🔍</button>
            </div>
            
            <select id="categoryFilter" class="filter-select">
                <option value="">All Categories</option>
                <option value="announcements">Announcements</option>
                <option value="tutorials">Tutorials</option>
                <option value="study-tips">Study Tips</option>
                <option value="resources">Resources</option>
            </select>
        </div>

        <!-- Featured Post Section -->
        <div id="featuredPost" class="featured-section">
            <!-- Featured post will be loaded dynamically -->
        </div>

        <!-- Blog Posts Grid -->
        <div id="blogContainer" class="blog-container">
            <!-- Blog posts will be loaded dynamically -->
        </div>

        <!-- Load More Button -->
        <div class="load-more-container">
            <button id="loadMoreBtn" class="load-more-btn">Load More Posts</button>
        </div>
    </div>

    <!-- Back Button -->
    <button class="back-button" onclick="window.location.href='/'">← Back</button>

    <!-- Core JavaScript -->
    <script src="{{ url_for('static', filename='javascript/core/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='javascript/core/api.js') }}"></script>
    
    <!-- Page-specific JavaScript -->
    <script src="{{ url_for('static', filename='javascript/pages/blog_public.js') }}"></script>
</body>
</html>
